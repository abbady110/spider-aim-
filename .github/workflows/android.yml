name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: '3.35.7'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap missing Flutter build tooling
        run: bash scripts/bootstrap_flutter.sh

      - name: Flutter environment
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting (informational)
        run: dart format --output=none lib test

      - name: Analyze
        run: |
          mkdir -p build/verification
          flutter analyze --fatal-infos 2>&1 | tee build/verification/analyze.log

      - name: Unit and widget tests
        run: flutter test --coverage --reporter expanded 2>&1 | tee build/verification/tests.log

      - name: Build physical-device Android APK
        run: flutter build apk --release --target-platform android-arm,android-arm64 2>&1 | tee build/verification/build-apk.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spider-aim-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider-aim-verification
          path: |
            build/verification/
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 30
